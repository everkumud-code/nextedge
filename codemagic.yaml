# Cloud build for the Flutter app — no local Flutter install needed.
# codemagic.io → Add application → this repo → workflow "android-debug" → Start new build. APK appears under Artifacts.
workflows:
  android-debug:
    name: Android debug APK
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Create platform folders (first time only)
        script: |
          cd apps/mobile
          if [ ! -d android ]; then flutter create . --org in.boombites --project-name coaching_connect --platforms android,ios; fi
      - name: Android permissions (location, internet)
        script: |
          cd apps/mobile
          M=android/app/src/main/AndroidManifest.xml
          grep -q ACCESS_FINE_LOCATION $M || sed -i.bak 's#<application#<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <application#' $M
          grep -q NSLocationWhenInUseUsageDescription ios/Runner/Info.plist || sed -i.bak 's#<dict>#<dict>\n\t<key>NSLocationWhenInUseUsageDescription</key>\n\t<string>Used to check in at the coaching centre.</string>#' ios/Runner/Info.plist
      - name: Get packages
        script: cd apps/mobile && flutter pub get
      - name: App name + launcher icon
        script: |
          cd apps/mobile
          sed -i.bak 's#android:label="coaching_connect"#android:label="NextEdge"#' android/app/src/main/AndroidManifest.xml
          sed -i.bak 's#<string>coaching_connect</string>#<string>NextEdge</string>#; s#<string>Coaching Connect</string>#<string>NextEdge</string>#' ios/Runner/Info.plist
          dart run flutter_launcher_icons || true
      - name: Analyze
        script: cd apps/mobile && (flutter analyze --no-fatal-infos --no-fatal-warnings || echo 'ANALYZE REPORTED ISSUES - see above; continuing to build')
      - name: Build APK
        script: cd apps/mobile && flutter build apk --debug
    artifacts:
      - apps/mobile/build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - boombitesindia@gmail.com
        notify:
          success: true
          failure: true

  android-release:
    name: Android release APK (Play Store later)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Create platform folders
        script: cd apps/mobile && [ -d android ] || flutter create . --org in.boombites --project-name coaching_connect --platforms android,ios
      - name: Android permissions (location, internet)
        script: |
          cd apps/mobile
          M=android/app/src/main/AndroidManifest.xml
          grep -q ACCESS_FINE_LOCATION $M || sed -i.bak 's#<application#<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <application#' $M
          grep -q NSLocationWhenInUseUsageDescription ios/Runner/Info.plist || sed -i.bak 's#<dict>#<dict>\n\t<key>NSLocationWhenInUseUsageDescription</key>\n\t<string>Used to check in at the coaching centre.</string>#' ios/Runner/Info.plist
      - name: Build
        script: cd apps/mobile && flutter pub get && (sed -i.bak 's#android:label="coaching_connect"#android:label="NextEdge"#' android/app/src/main/AndroidManifest.xml; dart run flutter_launcher_icons || true) && flutter build apk --release
    artifacts:
      - apps/mobile/build/app/outputs/flutter-apk/*.apk

  whitelabel-release:
    name: White-label release (one client app)
    max_build_duration: 60
    environment:
      flutter: stable
      # Set per client (from Platform page → Copy build variables): CENTRE_ID, APP_NAME, PACKAGE_ID, APP_COLOUR, APP_LOGO_URL, APP_ICON_URL, API_BASE
      # For Play Store signing add a keystore under Codemagic → Code signing identities and reference it here.
      vars:
        API_BASE: https://coaching-connect-api.onrender.com/api
    scripts:
      - name: Create platform folders
        script: cd apps/mobile && flutter create . --org in.nextedge --project-name coaching_connect --platforms android,ios
      - name: Get packages
        script: cd apps/mobile && flutter pub get
      - name: Apply white-label (name, package id, icon, colour, centre)
        script: cd apps/mobile && bash scripts/whitelabel.sh
      - name: Build Android app bundle + APK
        script: |
          cd apps/mobile
          DEFS=$(cat .whitelabel.defines)
          flutter build appbundle --release $DEFS
          flutter build apk --release $DEFS
    artifacts:
      - apps/mobile/build/app/outputs/bundle/release/*.aab
      - apps/mobile/build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients: [boombitesindia@gmail.com]
