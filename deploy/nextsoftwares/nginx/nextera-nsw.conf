# Next Era on its own NextSoftwares address. The web app is served from this server (built with the API address
# https://nextera.nextsoftwares.in); /api goes to the Next Era API, which still runs on Render. Written 14 Nov 2026.
server {
    listen 443 ssl; listen [::]:443 ssl;
    http2 on;
    server_name nextera.nextsoftwares.in;
    ssl_certificate     /etc/letsencrypt/live/nextera.nextsoftwares.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nextera.nextsoftwares.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 25m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    root /var/www/nextera-nsw; index index.html;

    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    set $era_api https://nextera-api-u8tk.onrender.com;
    location /api/ {
        proxy_pass $era_api;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Host nextera-api-u8tk.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 150s;
    }
    location /_expo/ { expires 30d; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location /assets/ { expires 30d; add_header Cache-Control "public"; try_files $uri =404; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location / { try_files $uri $uri/ /index.html; }
}
