# NextSoftwares: one domain, many products.
#   www.nextsoftwares.in / nextsoftwares.in   the login portal (static page)
#   fit. glow. care. .nextsoftwares.in        the separate NextFit / NextGlow / NextCare logins
#   <client>.nextsoftwares.in                 a client's own workspace (NextEdge school/coaching, or a NextFit/NextGlow/NextCare outlet)
# Each client address gets its own server block with its own certificate in /etc/nginx/nextsoftwares-hosts.conf, rewritten every
# minute by nsw-sync.py (nginx loads private keys as root only at start/reload, so certificates cannot be picked per request).
# Install: see deploy/nextsoftwares/README.md.

# the portal's address checks are public: slow down anyone trying to list every address
limit_req_zone $binary_remote_addr zone=nsw_lookup:5m rate=10r/s;

# ---- plain http: certificate challenges, then https ----
server {
    listen 80; listen [::]:80;
    server_name nextsoftwares.in www.nextsoftwares.in *.nextsoftwares.in;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt-nextsoftwares; }
    # attendance machines that cannot do HTTPS push their punches here (plain http); nothing else is served without HTTPS
    location /iclock/ { proxy_pass http://127.0.0.1:3012; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
    location / { return 301 https://$host$request_uri; }
}

# ---- the portal ----
server {
    listen 443 ssl; listen [::]:443 ssl;
    http2 on;
    server_name nextsoftwares.in www.nextsoftwares.in;
    ssl_certificate     /etc/letsencrypt/live/nextsoftwares.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nextsoftwares.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy strict-origin-when-cross-origin always;
    root /var/www/nextsoftwares-portal; index index.html;
    # address checks for the portal, answered by each product's own public endpoint
    location /edge-api/   { limit_req zone=nsw_lookup burst=20 nodelay; proxy_pass http://127.0.0.1:3012/api/; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 15s; }
    location /brands-api/ { limit_req zone=nsw_lookup burst=20 nodelay; proxy_pass http://127.0.0.1:4000/;     proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 15s; }
    location / { try_files $uri $uri/ /index.html; }
}

# ---- an address that has no certificate yet (or no client): a plain message, served with the portal's certificate ----
server {
    listen 443 ssl; listen [::]:443 ssl;
    http2 on;
    server_name *.nextsoftwares.in;
    ssl_certificate     /etc/letsencrypt/live/nextsoftwares.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nextsoftwares.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 404 "No workspace has this address, or it is being set up. Go to https://www.nextsoftwares.in to log in.\n";
}

# ---- one block per client address (written by nsw-sync.py) ----
include /etc/nginx/nextsoftwares-hosts.conf;
