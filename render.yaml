# Render Blueprint — deploys API + admin panel + Postgres + Redis in one click.
# Dashboard → New → Blueprint → connect this repo.
databases:
  - name: coaching-connect-db
    region: singapore
    plan: free
    databaseName: coaching_connect
    user: coaching

services:
  - type: redis
    name: coaching-connect-redis
    region: singapore
    plan: free
    ipAllowList: []

  - type: web
    name: coaching-connect-api
    runtime: node
    region: singapore
    plan: free
    rootDir: apps/api
    buildCommand: npm install && npm run build
    startCommand: npm run db:push && npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: coaching-connect-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: coaching-connect-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_MODE
        value: "dev"   # "dev" = OTP is always 123456; set "msg91" + MSG91_AUTH_KEY in production
      - key: CORS_ORIGIN
        value: "*"

  - type: web
    name: coaching-connect-admin
    runtime: static
    rootDir: apps/admin
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://coaching-connect-api.onrender.com

  # The whole Flutter app as a website: open in iPhone Safari / Android Chrome and "Add to Home Screen".
  # Installs Flutter during the build (about 2 minutes). No push notifications on the web version.
  - type: web
    name: coaching-connect-app
    runtime: static
    buildCommand: bash apps/mobile/render_build.sh
    staticPublishPath: apps/mobile/build/web
