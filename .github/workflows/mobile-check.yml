# TEMPORARY: compiles and tests the Flutter app on GitHub so the parent portal can be checked without a local Flutter install. Remove before merging.
name: Mobile check (temporary)
on:
  push:
    branches: [parent-mobile]
  workflow_dispatch: {}
jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Get packages
        run: cd apps/mobile && flutter pub get
      - name: Analyze
        run: cd apps/mobile && flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test
        run: cd apps/mobile && flutter test
